[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-simulation"
version = "0.1.0"
description = "Edge Simulation"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "opencv-python",
    "requests",
    "matplotlib",
]

[project.scripts]
edge-simulation = "api:run_server"

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["."]