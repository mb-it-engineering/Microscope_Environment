[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-mcp-client"
version = "0.1.0"
description = "Edge MCP Client"
requires-python = ">=3.9"
dependencies = [
    "mcp[cli]",
    "requests"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["."]